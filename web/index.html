<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fits — min-spec for AI skills</title>
<link rel="stylesheet" href="./app.css">
</head><body>
<header><div class="hin">
  <a href="#" class="logo" data-home>fits</a>
  <div class="lens"><span>my model</span><div class="mseg" id="mseg"></div>
    <div class="barbtn"><button id="barToggle">pass ≥ <span id="bp">0.80</span></button>
      <div class="pop" id="barpop"><h4>What counts as working</h4>
        <div class="sl"><div class="lb"><span>minimum pass rate</span><b id="lp">0.80</b></div>
          <input type="range" id="rp" min="0.10" max="0.98" step="0.01" value="0.80"></div>
        <label class="ck"><input type="checkbox" id="rs"> require a valid tool call (strict)</label>
        <div class="ft"><b id="fitn">0</b><span id="fitt"></span></div>
      </div></div>
  </div></div></header>
<div id="app"><div class="wrap"><div class="note">loading measurements…</div></div></div>
<script src="./app.js"></script>
</body></html>
