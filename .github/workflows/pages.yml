# Deploys web/ to GitHub Pages. Serving from Actions, project page at
# https://nikjain15.github.io/fits — every asset is referenced relatively, so no
# base path has to be configured.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fail if there is no data to publish
        # A site with no data must not deploy. An empty dataset is not a zero,
        # and a page of placeholders is the one thing this product exists to
        # prevent.
        run: test -s web/data/fits.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
